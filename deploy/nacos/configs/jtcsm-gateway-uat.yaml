# ========================================================
# jtcsm-gateway 测试（UAT）环境配置
# ========================================================
spring:
  data:
    redis:
      host: ${REDIS_HOST_UAT:localhost}
      port: ${REDIS_PORT_UAT:6379}
      password: ${REDIS_PASSWORD_UAT:}
      database: 2
  cloud:
    gateway:
      routes:
        - id: jtcsm-api
          uri: ${API_UAT_URL:http://uat-api:8081}
          predicates:
            - Path=/api/v1/**
        - id: jtcsm-admin
          uri: ${ADMIN_UAT_URL:http://uat-admin:8082}
          predicates:
            - Path=/api/admin/**

jwt:
  secret: ${JWT_SECRET_UAT}

logging:
  level:
    com.jtcsm.gateway: info
    org.springframework.cloud.gateway: info
