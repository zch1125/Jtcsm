version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: jtcsm
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql_data:/var/lib/mysql]

  # 初始化 Nacos 配置库（幂等，可重复执行）
  nacos-db-init:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
    volumes:
      - ./deploy/nacos/init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        until mysql -h mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e 'SELECT 1' >/dev/null 2>&1; do
          echo "waiting for mysql..."
          sleep 2
        done
        mysql -h mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" < /init/nacos-mysql-schema.sql
    depends_on:
      mysql:
        condition: service_started

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      nacos-db-init:
        condition: service_completed_successfully

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports: ["9200:9200"]

  api:
    build: .
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/jtcsm
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      RECIPE_IMAGE_DIR: /app/docs/recipes/images
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    ports: ["8081:8081","8082:8082"]
    volumes:
      - ./docs/recipes/images:/app/docs/recipes/images:ro
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      nacos:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro, ./frontend/jtcsm-web/dist:/usr/share/nginx/html/admin:ro]
    depends_on: [api]

volumes:
  mysql_data:
  nacos_logs:
