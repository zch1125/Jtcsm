server:
  port: 8082

spring:
  application:
    name: jtcsm-admin
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/jtcsm?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:Pass1234}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:jtcsm-dev-secret-key-at-least-256-bits-long}
  expiration: 604800000

admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASS:admin123}

management:
  health:
    elasticsearch:
      enabled: false

logging:
  level:
    com.jtcsm: debug
