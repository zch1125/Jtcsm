# ========================================================
# 管理后台 - 开发环境配置
# ========================================================
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/jtcsm?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:Pass1234}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1

jwt:
  secret: ${JWT_SECRET:jtcsm-dev-secret-key-at-least-256-bits-long}

admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASS:admin123}

logging:
  level:
    com.jtcsm: debug
