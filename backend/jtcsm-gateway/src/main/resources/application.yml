# ========================================================
# Nacos 引导配置
# 业务配置统一存放在 Nacos（jtcsm-gateway.yaml + jtcsm-gateway-{profile}.yaml）
# ========================================================
spring:
  application:
    name: jtcsm-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        timeout: 5000
  config:
    import:
      - "nacos:jtcsm-gateway.yaml?refreshEnabled=true&group=DEFAULT_GROUP"
---
spring:
  config:
    activate:
      on-profile: dev
    import: "nacos:jtcsm-gateway-dev.yaml?refreshEnabled=true&group=DEFAULT_GROUP"
---
spring:
  config:
    activate:
      on-profile: uat
    import: "nacos:jtcsm-gateway-uat.yaml?refreshEnabled=true&group=DEFAULT_GROUP"
---
spring:
  config:
    activate:
      on-profile: pro
    import: "nacos:jtcsm-gateway-pro.yaml?refreshEnabled=true&group=DEFAULT_GROUP"
