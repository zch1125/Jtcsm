# ========================================================
# 生产环境配置
# 所有敏感信息必须通过环境变量注入，禁止硬编码
# ========================================================
spring:
  datasource:
    url: ${MYSQL_URL_PRO}
    username: ${MYSQL_USERNAME_PRO}
    password: "${MYSQL_PASSWORD_PRO}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 生产环境连接池调优
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      test-on-borrow: false
      test-while-idle: true
      validation-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST_PRO}
      port: ${REDIS_PORT_PRO:6379}
      password: ${REDIS_PASSWORD_PRO}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY_PRO}
      base-url: https://api.deepseek.com
      chat:
        api-key: ${DEEPSEEK_API_KEY_PRO}
        base-url: https://api.deepseek.com
        options:
          model: deepseek-chat
      embedding:
        api-key: ${EMBEDDING_API_KEY_PRO}
        base-url: ${EMBEDDING_BASE_URL_PRO:https://dashscope.aliyuncs.com/compatible-mode}
        options:
          model: ${EMBEDDING_MODEL_PRO:text-embedding-v3}
          dimensions: 1024

jwt:
  secret: ${JWT_SECRET_PRO}
  expiration: 604800000

logging:
  level:
    com.jtcsm: warn
    org.springframework.ai: warn

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
